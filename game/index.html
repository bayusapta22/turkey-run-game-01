<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Turkey Run — Pip escapes Thanksgiving</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b1a12; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif; color: #fff3c4;
  }
  h1 { font-size: 20px; margin: 10px 0 8px; letter-spacing: 2px; }
  h1 span { color: #ffd94d; }
  #wrap {
    position: relative; width: min(960px, 96vw);
    box-shadow: 0 12px 48px rgba(0,0,0,0.6); border-radius: 10px; overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; background: #ff9d5c; }
  p.hint { font-size: 14px; margin: 10px 0 0; opacity: 0.85; text-align: center; }
  p.hint b { color: #ffd94d; }
</style>
</head>
<body>
  <h1>🦃 TURKEY RUN <span>— Pip escapes Thanksgiving</span></h1>
  <div id="wrap">
    <canvas id="game" width="960" height="540" aria-label="Turkey Run game canvas"></canvas>
  </div>
  <p class="hint"><b>← →</b> or <b>A / D</b> move &nbsp;·&nbsp; <b>SPACE / ↑</b> jump, twice to flap &nbsp;·&nbsp; <b>↓ / S</b> slide under the cleaver &nbsp;·&nbsp; click the canvas to flap &nbsp;·&nbsp; <b>P</b> pause · <b>M</b> mute · <b>R</b> restart</p>
  <p class="hint">Outrun Farmer Bram for 2000 m. Corn feeds your score — and slows him down.</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
